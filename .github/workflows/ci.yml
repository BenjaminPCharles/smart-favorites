name: ci

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  tests:
    name: ci/tests
    runs-on: ubuntu-latest

    services:
      testdatabase:
        image: pgvector/pgvector:0.8.1-pg18-trixie
        env:
          POSTGRES_USER: smart_favorites_test
          POSTGRES_PASSWORD: smart_favorites_test
          POSTGRES_DB: smart_favorites_test
        ports:
          - 5433:5432
        # Without this the steps start while PostgreSQL is still initialising, and the suite races.
        options: >-
          --health-cmd "pg_isready -U smart_favorites_test -d smart_favorites_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test:ts

      - run: pnpm test
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 5433
          TEST_DB_USER: smart_favorites_test
          TEST_DB_PASSWORD: smart_favorites_test
          TEST_DB_NAME: smart_favorites_test
