services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg18-trixie
    container_name: smart-favorites-db
    restart: 'always'
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${SERVICE_DB_USER}
      - POSTGRES_PASSWORD=${SERVICE_DB_PASSWORD}
      - POSTGRES_DB=${SERVICE_DB_NAME}
    ports:
      - "${SERVICE_DB_PORT}:5432"
    volumes:
      - smart-favorites-db-data:/var/lib/postgresql
    networks:
      - app-network

  testdatabase:
    image: pgvector/pgvector:0.8.1-pg18-trixie
    container_name: smart-favorites-db-test
    restart: "no"
    environment:
      POSTGRES_USER: smart_favorites_test
      POSTGRES_PASSWORD: smart_favorites_test
      POSTGRES_DB: smart_favorites_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smart_favorites_test -d smart_favorites_test']
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  smart-favorites-db-data: